packages:
  - apps/*
  - packages/*
  - tooling/*

# Without this, pnpm 11 only warns when the workspace's own range does not match, and it
# reads the setting from this file alone: an `engine-strict` line in `.npmrc` is ignored.
engineStrict: true

# lefthook's postinstall writes the git hooks, skips itself in CI and never fails an install.
allowBuilds:
  # The install script only downloads a binary the platform package already provides.
  esbuild: false
  lefthook: true

# Peer ranges that lag behind a release the package already works with, each one checked
# by running it, and each removable once upstream widens its own range.
peerDependencyRules:
  allowedVersions:
    # The rules run on ESLint 10; the plugin's last release predates it.
    eslint-plugin-jsx-a11y>eslint: "10"
    # Only reads tsconfig files and never calls the TypeScript compiler.
    tsconfck>typescript: "6"

# eslint-plugin-react-hooks loads the `v4` entry point that 3.5.4 no longer exports, and
# Steiger needs the 3.x line, so without this they share 3.5.4 and the plugin fails to load.
overrides:
  eslint-plugin-react-hooks>zod-validation-error: ^4.0.2

