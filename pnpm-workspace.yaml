packages:
  - apps/*
  - packages/*
  - tooling/*

# Refuse to install a dependency whose `engines` range excludes the running Node.js.
# pnpm 11 reads this setting from this file only: `.npmrc` now carries auth and
# registry settings, so an `engine-strict` line there is silently ignored.
engineStrict: true

catalog:
  "@types/node": ^24.13.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  next: ^16.3.5
  react: ^19.3.0
  react-dom: ^19.3.0
  turbo: ^2.10.13
  # TypeScript minors can break types, so stay on 6.0.x: typescript-eslint
  # supports `<6.1.0`, and TypeScript 7 ships without the compiler API it needs.
  typescript: ~6.0.3
