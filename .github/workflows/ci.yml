name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its run in progress; every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a version input, the action installs the pnpm that packageManager names.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turborepo hashes the inputs of every task itself, so a cache restored from an
      # older commit can only miss; it never replays a stale result.
      - name: Restore the Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Every check runs even when an earlier one failed, so one run reports every problem.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Comments
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:comments

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm types:check

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Spelling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm spell:check

      - name: Markdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:md

      - name: Env example
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm env:check

      - name: Env in Turborepo
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm env:check:turbo

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  # Off until the repository variable ENFORCE_AUTHOR_IDENTITY is set to true. Only
  # GitHub can tell which account owns an email address, and the check needs a token
  # with push access, which a pull request from a fork never gets.
  author-identity:
    name: Author identity
    if: vars.ENFORCE_AUTHOR_IDENTITY == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check every commit author
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: node tooling/scripts/check-author-identity.mjs "$REPOSITORY" "$PULL_REQUEST"
