# Keeps the commit SHAs that pin the workflow actions current, in one pull request a month.
# The ci(deps) prefix gives that pull request a title the PR title check accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
