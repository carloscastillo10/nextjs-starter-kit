# The npm packages are deliberately not here: each version is one entry in the pnpm catalog,
# which the root README repeats badge by badge, so a bump is one decision taken by hand.
# Past this prefix a Dependabot title cannot follow the commit convention, so the title check
# skips it and the title is rewritten when the pull request is squashed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
