# A repository created from a template does not inherit labels, and a form that asks for one
# that does not exist applies nothing and warns nobody, so the set is declared here and created
# once. The contributing guide has the commands; a label-sync action reads this file as it is.
#
# Six is the whole taxonomy: three about what kind of work it is, two about what it is waiting
# for, one about a decision taken. A second place answering "what state is this in" disagrees
# with the first within a week. The colors are the ones GitHub gives a new repository.
- name: bug
  color: d73a4a
  description: Behaves differently from what is written down
- name: enhancement
  color: a2eeef
  description: One unit of work, with acceptance criteria
- name: documentation
  color: 0075ca
  description: Only the documentation changes
- name: needs-triage
  color: fbca04
  description: Opened and not yet read. Every form applies this
- name: needs-info
  color: d876e3
  description: Nobody can check this off until a question is answered
- name: wontfix
  color: ffffff
  description: Understood, and deliberately not being done
