# The labels this repository uses. A repository created from a template does not inherit
# labels, and an issue form that asks for one that does not exist applies nothing and says
# nothing, so the set is declared here and created once. CONTRIBUTING.md, under Repository
# settings, has the commands; a label-sync action reads this file as it stands.
#
# Two answers about type and one about state. Everything else a board column answers better,
# and two places that answer the same question disagree within a week.
#
# The colors are the ones GitHub gives a new repository, so creating these changes nothing
# that already looks right.
#
# cspell:ignore eeef fbca
- name: bug
  color: d73a4a
  description: Behaves differently from what is written down
- name: enhancement
  color: a2eeef
  description: One unit of work, with acceptance criteria
- name: documentation
  color: 0075ca
  description: Only the documentation changes
- name: needs-triage
  color: fbca04
  description: Opened and not yet read. Every form applies this
- name: needs-info
  color: d876e3
  description: Nobody can check this off until a question is answered
- name: wontfix
  color: ffffff
  description: Understood, and deliberately not being done
