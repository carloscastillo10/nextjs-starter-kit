# The hook scripts run the first lefthook on the PATH before the pinned one, and the setup
# step below needs 2.1.2 or later, so an older one stops here instead of skipping it.
min_version: 2.1.14

# The two fixers run one after the other, Prettier last, so they never write the same file
# at once and the layout Prettier chooses is the one that gets committed.
pre-commit:
  setup:
    - run: node tooling/scripts/git/fix-staged.mjs --record

  jobs:
    - name: eslint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: node tooling/scripts/git/fix-staged.mjs eslint {staged_files}
      stage_fixed: true

    - name: prettier
      run: node tooling/scripts/git/fix-staged.mjs prettier {staged_files}
      stage_fixed: true

    - name: checks
      group:
        parallel: true
        jobs:
          - name: comments
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
            run: pnpm lint:comments {staged_files}

          - name: spelling
            run: pnpm exec cspell --no-progress --no-must-find-files {staged_files}

          # Every file, not only the staged ones: a file argument is read as a glob, so a
          # folder such as `[slug]` matches nothing and a literal path skips the ignores.
          - name: markdown
            glob: "*.md"
            run: pnpm lint:md

          - name: frontmatter
            glob: "*.md"
            run: pnpm lint:frontmatter {staged_files}

          # Types belong to a whole project, so a staged subset would answer the wrong question.
          - name: types
            glob:
              - "*.{ts,tsx,mts,cts}"
              - "*.json"
            run: pnpm types:check --output-logs=errors-only

# identity runs here because pre-commit skips every job when nothing is staged, so an empty
# commit or a message-only amend would pass unchecked.
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

    - name: identity
      run: node tooling/scripts/git/check-git-identity.mjs

pre-push:
  jobs:
    - name: authors
      run: node tooling/scripts/git/check-push-authors.mjs

    - name: linked
      run: node tooling/scripts/git/check-linked-branch.mjs

    - name: scope
      run: node tooling/scripts/git/check-branch-scope.mjs

    - name: checks
      group:
        parallel: true
        jobs:
          - name: tests
            run: pnpm test --output-logs=errors-only

          - name: architecture
            run: pnpm exec turbo run lint:arch lint:deps --output-logs=errors-only

          - name: env
            run: pnpm env:check

          - name: env-turbo
            run: pnpm env:check:turbo

          - name: echo
            run: pnpm lint:echo

          - name: comment-share
            run: pnpm lint:comments --changed origin/main

post-commit:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-commit {0}
      skip:
        - rebase

post-checkout:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-checkout {0}
      skip:
        - rebase

post-merge:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-merge {0}

# git runs this while the rebase still shows as in progress, so it cannot skip rebases.
post-rewrite:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-rewrite {0}
