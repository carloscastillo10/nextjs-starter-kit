# Git hooks, installed by `pnpm install` through the postinstall script of lefthook.
# `LEFTHOOK=0 git commit ...` skips every hook for one command, and
# `LEFTHOOK_EXCLUDE=<job>` skips one job. CONTRIBUTING.md says when either is fine.
#
# One top-level key per hook, each with named jobs; a new hook goes at the end.

# The hook scripts run the first lefthook on the PATH before the pinned one, and the
# pre-commit setup step needs 2.1.2 or later, so an older lefthook stops here instead
# of silently skipping it. 2.1.14 is the version these hooks were verified with.
min_version: 2.1.14

# ESLint and Prettier fix the staged files and stage the result. While the hook runs,
# lefthook hides the unstaged part of a partially staged file, so every job reads
# exactly what the commit will contain. The two fixers run one after the other,
# Prettier last, so they never write the same file at once and the layout Prettier
# chooses is the one committed. The checks run together after them, on fixed files.
# A failure does not stop the jobs after it, so one commit reports every problem.
#
# fix-staged only checks a partially staged file instead of rewriting it: when a
# rewrite collides with the hidden unstaged lines, lefthook 2.1.14 reverts every
# unstaged change in the repository (upstream issue 1480). The setup step records
# those files before lefthook hides anything. A new job that rewrites files goes
# through fix-staged too.
pre-commit:
  setup:
    - run: node tooling/scripts/git/fix-staged.mjs --record

  jobs:
    - name: eslint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: node tooling/scripts/git/fix-staged.mjs eslint {staged_files}
      stage_fixed: true

    - name: prettier
      run: node tooling/scripts/git/fix-staged.mjs prettier {staged_files}
      stage_fixed: true

    - name: checks
      group:
        parallel: true
        jobs:
          - name: comments
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
            run: pnpm lint:comments {staged_files}

          - name: spelling
            run: pnpm exec cspell --no-progress --no-must-find-files {staged_files}

          # Lints every Markdown file, not only the staged ones: markdownlint-cli2 reads a
          # file argument as a glob, so a Next.js folder such as `[slug]` or `(group)`
          # matches nothing, and a literal path skips the ignores in its config.
          - name: markdown
            glob: "*.md"
            run: pnpm lint:md

          - name: frontmatter
            glob: "*.md"
            run: pnpm lint:frontmatter {staged_files}

          # Types belong to a whole project, so this runs the full check; Turborepo
          # replays every package whose files did not change from its cache.
          - name: types
            glob:
              - "*.{ts,tsx,mts,cts}"
              - "*.json"
            run: pnpm types:check --output-logs=errors-only

# identity runs here rather than in pre-commit: pre-commit skips every job when
# nothing is staged, so an empty commit or a message-only amend would pass
# unchecked, while commit-msg runs for every commit git creates, merges included.
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

    - name: identity
      run: node tooling/scripts/git/check-git-identity.mjs

# The guards run one after the other, so the branch report prints on its own; a
# failure does not stop the jobs after it. Then the checks that read the whole
# project run together, and Turborepo replays unchanged packages from its cache.
pre-push:
  jobs:
    - name: authors
      run: node tooling/scripts/git/check-push-authors.mjs

    - name: linked
      run: node tooling/scripts/git/check-linked-branch.mjs

    - name: scope
      run: node tooling/scripts/git/check-branch-scope.mjs

    - name: checks
      group:
        parallel: true
        jobs:
          - name: tests
            run: pnpm test --output-logs=errors-only

          - name: architecture
            run: pnpm lint:arch --output-logs=errors-only

          - name: env
            run: pnpm env:check

          - name: env-turbo
            run: pnpm env:check:turbo

          - name: echo
            run: pnpm lint:echo

          - name: comment-share
            run: pnpm lint:comments --changed origin/main

# The code graph follows HEAD: after a commit, a branch checkout, a merge or a pull, and
# a rebase, which runs neither of the first two for the commits it replays. The script
# does nothing without graphify on the PATH, never fails, and returns at once, leaving
# the rebuild to a detached process; hooks that fire while one runs add one more
# rebuild at most, never a second at the same time. LEFTHOOK_EXCLUDE=graph turns it off
# for one command, and lefthook-local.yml for good in one clone.
post-commit:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-commit {0}
      skip:
        - rebase

post-checkout:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-checkout {0}
      skip:
        - rebase

post-merge:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-merge {0}

# git runs this while the rebase still shows as in progress, so it cannot skip rebases.
post-rewrite:
  jobs:
    - name: graph
      run: node tooling/scripts/graphify/graph-rebuild.mjs post-rewrite {0}
